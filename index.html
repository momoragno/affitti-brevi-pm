<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso riservato</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1116;color:#e6edf3;font-family:'Inter',system-ui,sans-serif}
 .card{background:#161b22;border:1px solid #2a323d;border-radius:16px;padding:34px 30px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
 h1{font-size:18px;margin:0 0 4px} p{color:#9aa7b4;font-size:13px;margin:0 0 20px}
 input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid #2a323d;background:#0e1116;color:#e6edf3;font-size:15px;text-align:center}
 input:focus{outline:none;border-color:#6d8bff}
 button{width:100%;margin-top:12px;padding:11px;border:none;border-radius:9px;background:#6d8bff;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
 button:hover{opacity:.9} .err{color:#f87171;font-size:12px;height:16px;margin-top:10px}
 .lock{font-size:28px;margin-bottom:6px}
</style>
</head>
<body>
<div class="card">
 <div class="lock">🔒</div>
 <h1>Contenuto riservato</h1>
 <p>Inserisci la password per accedere.</p>
 <input id="pw" type="password" placeholder="Password" autofocus autocomplete="off">
 <button id="go">Entra</button>

</div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));
 const html=new TextDecoder().decode(pt);
 document.open();document.write(html);document.close();
}
const err=document.getElementById('err'),pw=document.getElementById('pw');
function go(){err.textContent='';unlock(pw.value).catch(()=>{err.textContent='Password errata';pw.value='';pw.focus();});}
document.getElementById('go').onclick=go;
pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
